# 活动名对照表：活动编号 → 正式活动名。eidolon story sync 用它给从镜像拉取的活动剧情（原文剧情）命名。
#
# 复制为 deploy/event-names.toml 后填写，每出一个新活动加一行即可；改完后下一次同步就会更新剧情目录里的活动名，
# 不需要重新下载。真实文件不进仓库（和角色配置一样属于部署配置）。
#
# 活动编号是活动剧情剧本编号 4001NNNHH 里的 NNN（例如 game_event_communications/400109701 是活动 097 的第 1 话）；
# 同步结束时会列出对照表里还没有的活动编号。
#
# 活动名请和 SCTranslationData 里这个活动的目录名写得一模一样：汉化版到位后按目录名归组，
# 名字一致才会取代原文剧情后仍留在同一个活动下面。没填的活动出处为「活动剧情 NNN」，标题为「第N話」。

[events]
# 格式：三位活动编号 = "活动名"，例如
# 097 = "（SCTranslationData 里这个活动的目录名）"
