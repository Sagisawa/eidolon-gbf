# Eidolon-GBF 角色配置。
#
# 每位角色一个 [[characters]] 段：
#   id        规范标识（小写字母、数字、- 和 _）
#   name      显示名
#   name_zh   中文译名（"娜露梅"、"维卡拉"）
#   name_kana 平假名读音（"なるめあ"、"びから"）
#   name_romaji 罗马字（"Narmaya"、"Vikala"）
#   intro     角色选择与列表页简介
#   voice_id  Fish Audio 音色 ID
#   sheet     人设文件，路径相对于本文件
#   avatar    头像图片，路径相对于本文件
#   color     代表色，#rrggbb
#   background 通话层背景图，路径相对于本文件
#   facts     角色资料 Markdown，路径相对于本文件
#   liked_gifts 她喜欢的礼物 ID 列表（见 gifts.toml）
#   speakers  剧本台词里她的说话人名字（识别剧情出场角色）
#   greeting  招呼（日语）
#   greeting_subtitle 招呼中文字幕
#   photo_tag Danbooru 角色 tag
#   photo_appearance 外貌 tag

