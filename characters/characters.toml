# 角色配置。新增角色、替换音色 ID 只需要改这个文件，不需要改代码。
#
# 每位角色一个 [[characters]] 段：
#   id        规范标识，用在网址和剧情库的出场角色里（小写字母、数字、- 和 _）
#   name      显示名
#   intro     角色选择页上的简介
#   voice_id  Fish Audio 音色 ID；公共音色下架后换成自己的私有音色即可
#   sheet     人设文件，路径相对于本文件
#   avatar    头像图片（可选），路径相对于本文件；文件不存在时不显示头像
#
# 人设文件和头像不进仓库（ADR-0003）：参照 sheets/example.md 自己编写
# sheets/mano.md 和 sheets/kogane.md，头像放在 avatars/ 下。

[[characters]]
id = "mano"
name = "櫻木真乃"
intro = "illumination STARS 的中心。温柔又有点慢热，喜欢鸟，常和鸽子「ピーちゃん」在一起。"
voice_id = "a1150f3d14ac46fb8ea59c7803cd8357"
sheet = "sheets/mano.md"
avatar = "avatars/mano.png"

