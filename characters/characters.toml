# 角色配置。新增角色、替换音色 ID 只需要改这个文件，不需要改代码。
#
# 每位角色一个 [[characters]] 段：
#   id        规范标识，用在网址和剧情库的出场角色里（小写字母、数字、- 和 _）
#   name      显示名
#   intro     角色选择页上的简介
#   voice_id  Fish Audio 音色 ID。音色要设为公开：自带 Fish Audio 密钥的用户用自己的 key 调用它（ADR-0003 的修订）
#   sheet     人设文件，路径相对于本文件
#   avatar    头像图片（可选），路径相对于本文件；文件不存在时不显示头像
#   color     印象色，原作官方的代表色，#rrggbb；界面上属于她的地方都以它为基调
#   background 通话层背景图（可选），路径相对于本文件；没有或文件不存在时用印象色的渐变代替
#   facts     角色资料（可选），路径相对于本文件；Markdown，每个标题下的内容是一条，对话中按需检索；
#             文件不存在时不检索角色资料。修改后重启后端即可，不需要重新导入
#   speakers  剧情台词里她的说话人名字，用来识别剧情的出场角色；修改后需要重新导入剧情库
#   idol_id   原作的偶像编号（可选），即立绘镜像 spine_manifest.json 里的 idolId，正整数
#   default_outfit 立绘的默认衣装（可选），写成 stand/<enzaId>（这张卡的私服）或 stand_costume/<enzaId>
#             （这张卡的演出服），enzaId 是 spine_manifest.json 里的十位编号。用户没选过衣装时她穿这一套。
#             idol_id、default_outfit 和后端的 EIDOLON_STAND_ASSETS_URL 都配好了，通话层才显示立绘，
#             否则只显示背景图（docs/deploy.md「立绘素材」）
#
# 人设文件和角色资料是自己写的，提交进仓库：参照 sheets/example.md 编写 sheets/<角色标识>.md
# （也可以先用 eidolon character draft-sheet 生成初稿再校对），参照 facts/example.md 编写 facts/<角色标识>.md。
# 头像放在 avatars/ 下，通话层背景图放在 backgrounds/ 下，同样提交进仓库。

