# 每个 PR 和 main 上的每次推送：检查后端、前端和 shell 脚本，再构建两个镜像。
# 推送到 main 或 v* 标签时，检查全部通过才把镜像推到 GHCR（部署见 docs/deploy.md「升级」）。
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# 同一个 PR 推了新提交时取消旧的运行；main 上的每次推送都跑完，免得漏发镜像
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
          enable-cache: true
      # --locked：uv.lock 和 pyproject.toml 对不上时失败
      - run: uv sync --locked
      - run: uv run pyright
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 改了 src/theme/notebookTheme.ts 却没重新运行 npm run theme:build 时失败
      - run: npm run theme:check
      # next build 由下面的镜像构建跑

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/*.sh scripts/*.sh

  image:
    needs: [backend, frontend, shellcheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main → :main，v1.2.3 → :1.2.3 和 :latest，每次推送另有 :sha-<7 位提交哈希> 方便回滚
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sallyn0225/eidolon-sc-${{ matrix.service }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha
      # PR 上只构建、不推送
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
