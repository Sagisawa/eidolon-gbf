# 重排校准数据集（issues/03：比较 Qwen3-Reranker-0.6B 与 4B，定出检索阈值和记忆阈值）
#
# 用法：`eidolon eval rerank [--model 模型名]` 读这份文件，对每条问题按对话中相同的方式取候选
# （剧情库 + 角色资料各取 CANDIDATES_PER_SOURCE 条；记忆取 CANDIDATES 条）并重排，
# 按「相关 / 不相关」分组打印分数分布。
#
# 格式：
#
#   # 示例记忆：只用于 memory 类问题，运行时临时向量化，不写入数据库
#   [[memories]]
#   key = "cat"            # 在 cases 里引用
#   source = "mano"        # 来源角色
#   text = "制作人养了一只叫小白的猫"
#
#   [[cases]]
#   id = "mano-story-birds"          # 唯一，kebab-case
#   character = "mano"
#   kind = "story"                    # story | facts | memory
#   query = "……"                      # 制作人说的原话，口语
#   relevant = ["produce_events/…"]   # story: 剧情编号；facts: 资料标题路径；memory: 记忆 key
#   acceptable = []                   # 放进提示词也可以、不放也可以的，不计入统计（可省略）
#   note = "为什么这些相关；容易混淆的是哪几段"
#   reviewed = false                  # 人工校对过改成 true
#
# 标注规则：
# - 进入候选、但既不在 relevant 也不在 acceptable 里的，一律算「不相关」。
# - 剧情按「段」（剧情编号）判断相关与否：一段剧情的分数取它得分最高的那个段落的重排分数。
# - relevant = [] 表示这句话什么都不该放进提示词（闲聊、剧情库里没有的话题）。
# - story 类问题的候选里也会混有角色资料（对话中两者一起重排），反之亦然；
#   relevant / acceptable 可以同时写剧情编号和资料标题路径。
# - 角色只能回忆自己出场过的剧情，这里用到的剧情都确认她是出场角色。只取成功路线（正式经历）。
# - 本文件只含问题、剧情编号、资料标题和标注，不含剧情原文（ADR-0003），可以提交。
# - 剧情编号来自 SCTranslationData 各 CSV 的 info 行（与 story_import 的来源标识一致）。
# - 资料标题是 characters/facts/<角色标识>.md 解析出的标题路径（「上级标题 / 本级标题」）；
#   改了资料文件的标题，这里要跟着改。
# - 标注是 agent 起草的初稿，每条都要人工校对（reviewed = false）。

# ---------------------------------------------------------------------------
# 示例记忆（memory 类问题用；含几条相似但不同的干扰项，来自两位角色）
# ---------------------------------------------------------------------------

